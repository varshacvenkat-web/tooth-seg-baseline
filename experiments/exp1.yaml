name: exp1
hypothesis: "Mosaic (on for epochs 1-40 by default) shows the model only partial jaws, removing the full-arch context needed to count teeth. This causes off-by-one tooth numbering, our most common error."
change: {mosaic: 0.0}      # exactly ONE setting
expected: "Neighbour wrong-number errors on the 88-image test set drop by >= 20% (mean over seeds 0,1,2) vs baseline, and mask mAP50 rises by more than the baseline seed SD (0.0018)."
reject_if: "Neighbour errors drop < 20%, or mAP50 changes by less than 0.0018 or falls."
seeds: [0, 1, 2]
signed_off: false
